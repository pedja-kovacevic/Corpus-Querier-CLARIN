name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean CorpusQuerier.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\CorpusQuerier.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Corpus-Querier-Windows-Installer
          path: installer-output/Corpus-Querier-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/Corpus-Querier-Setup.exe
          generate_release_notes: true

